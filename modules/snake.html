<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Snake Game</title>
<style>
  body{background:#0f172a;color:#e2e8f0;font-family:'Segoe UI',Arial,sans-serif;text-align:center;padding:20px;}
  canvas{background:#1e293b;border-radius:10px;margin-top:10px;}
  h2{color:#38bdf8;}
</style>
</head>
<body>
<h2>Snake Game</h2>
<p>Score: <span id="score">0</span> | Arrow keys se khelo</p>
<canvas id="c" width="400" height="400"></canvas>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d'),s=20;
let snake=[{x:200,y:200}],dir={x:s,y:0},food={},score=0,gameOver=false;
function rand(){return Math.floor(Math.random()*20)*s;}
function newFood(){food={x:rand(),y:rand()};}
newFood();
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowUp'&&dir.y===0)dir={x:0,y:-s};
  if(e.key==='ArrowDown'&&dir.y===0)dir={x:0,y:s};
  if(e.key==='ArrowLeft'&&dir.x===0)dir={x:-s,y:0};
  if(e.key==='ArrowRight'&&dir.x===0)dir={x:s,y:0};
});
setInterval(()=>{
  if(gameOver)return;
  const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  if(head.x<0||head.x>=400||head.y<0||head.y>=400||snake.some(p=>p.x===head.x&&p.y===head.y)){gameOver=true;alert('Game Over! Score: '+score);return;}
  snake.unshift(head);
  if(head.x===food.x&&head.y===food.y){score++;document.getElementById('score').textContent=score;newFood();}
  else snake.pop();
  ctx.fillStyle='#1e293b';ctx.fillRect(0,0,400,400);
  ctx.fillStyle='#ef4444';ctx.fillRect(food.x,food.y,s,s);
  ctx.fillStyle='#38bdf8';snake.forEach(p=>ctx.fillRect(p.x,p.y,s-1,s-1));
},120);
</script>
</body>
</html>
