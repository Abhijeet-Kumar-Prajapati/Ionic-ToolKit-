<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Game - Advanced</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif;}
body{background:linear-gradient(135deg,#0f172a,#1e293b);color:#e2e8f0;text-align:center;padding:15px;}
h1{color:#4ade80;text-shadow:0 0 12px #4ade80;}
#hud{display:flex;justify-content:center;gap:20px;margin:10px;font-size:1.1rem;flex-wrap:wrap;}
#hud span{background:#1e293b;padding:8px 14px;border-radius:8px;border:1px solid #334155;}
canvas{background:#0b1220;border:3px solid #4ade80;border-radius:12px;box-shadow:0 0 20px rgba(74,222,128,.4);max-width:95vw;}
#overlay{position:relative;display:inline-block;}
.panel{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(15,23,42,.95);padding:25px;border-radius:15px;border:2px solid #4ade80;display:none;min-width:280px;}
button{padding:10px 20px;margin:6px;border:none;border-radius:8px;background:#16a34a;color:white;cursor:pointer;font-size:1rem;}
button:hover{background:#22c55e;}
#touch{display:flex;flex-direction:column;align-items:center;margin-top:12px;}
#touch button{width:55px;height:45px;font-size:1.3rem;background:#334155;}
#touch div{display:flex;gap:6px;}
.muted{background:#334155;}
</style>
</head>
<body>
<h1>🐍 Snake Game Pro</h1>
<div id="hud">
  <span>Score: <b id="score">0</b></span>
  <span>High: <b id="high">0</b></span>
  <span>Level: <b id="level">1</b></span>
  <span>Speed: <b id="speed">1x</b></span>
  <button class="muted" id="soundBtn" onclick="toggleSound()">🔊 Sound</button>
</div>
<div id="overlay">
  <canvas id="game" width="440" height="440"></canvas>
  <div class="panel" id="startPanel" style="display:block;">
    <h2>Snake Game Pro</h2>
    <p>Arrow keys / swipe / buttons se khelo. Space = Pause.</p>
    <button onclick="startGame()">Start</button>
  </div>
  <div class="panel" id="levelPanel"><h2 id="levelMsg">Level 2!</h2><button onclick="nextLevel()">Continue</button></div>
  <div class="panel" id="overPanel"><h2>Game Over</h2><p>Score: <b id="finalScore"></b></p><button onclick="restart()">Restart</button></div>
</div>
<div id="touch">
  <button onclick="setDir(0,-1)">▲</button>
  <div><button onclick="setDir(-1,0)">◀</button><button onclick="setDir(0,1)">▼</button><button onclick="setDir(1,0)">▶</button></div>
</div>
<script>
const cv=document.getElementById('game'),cx=cv.getContext('2d'),S=20,N=22;
let snake,dir,nextDir,food,obstacles,score,level,speed,running,paused,gameOver,soundOn=true,timer;
let high=parseInt(localStorage.getItem('snakeHigh')||'0');document.getElementById('high').textContent=high;
function beep(f,d,type='sine'){if(!soundOn)return;const a=new (window.AudioContext||window.webkitAudioContext)();const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;g.gain.value=0.1;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d);}
function toggleSound(){soundOn=!soundOn;document.getElementById('soundBtn').textContent=soundOn?'🔊 Sound':'🔇 Mute';}
function init(){snake=[{x:11,y:11},{x:10,y:11},{x:9,y:11}];dir={x:1,y:0};nextDir={x:1,y:0};score=0;level=1;speed=140;obstacles=[];gameOver=false;paused=false;running=true;spawnFood();document.getElementById('score').textContent=0;document.getElementById('level').textContent=1;document.getElementById('speed').textContent='1x';}
function setDir(x,y){if(x===-dir.x&&y===-dir.y)return;nextDir={x,y};}
function spawnFood(){do{food={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)};}while(snake.some(s=>s.x===food.x&&s.y===food.y)||obstacles.some(o=>o.x===food.x&&o.y===food.y));}
function startGame(){init();document.getElementById('startPanel').style.display='none';loop();}
function restart(){document.getElementById('overPanel').style.display='none';init();loop();}
function nextLevel(){document.getElementById('levelPanel').style.display='none';running=true;loop();}
function makeObstacles(){obstacles=[];const count=(level-1)*4;for(let i=0;i<count;i++){const o={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)};if(Math.abs(o.x-snake[0].x)<3&&Math.abs(o.y-snake[0].y)<3)continue;if(snake.some(s=>s.x===o.x&&s.y===o.y))continue;obstacles.push(o);}}
function loop(){clearTimeout(timer);if(!running)return;if(!paused){update();draw();}timer=setTimeout(loop,speed);}
function update(){dir=nextDir;const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
if(h.x<0||h.x>=N||h.y<0||h.y>=N||snake.some(s=>s.x===h.x&&s.y===h.y)||obstacles.some(o=>o.x===h.x&&o.y===h.y)){gameOver=true;running=false;beep(150,.5,'sawtooth');document.getElementById('finalScore').textContent=score;if(score>high){high=score;localStorage.setItem('snakeHigh',high);document.getElementById('high').textContent=high;}document.getElementById('overPanel').style.display='block';return;}
snake.unshift(h);
if(h.x===food.x&&h.y===food.y){score+=10;beep(600,.1);document.getElementById('score').textContent=score;
if(score>=level*50){level++;speed=Math.max(50,140-(level-1)*15);document.getElementById('level').textContent=level;document.getElementById('speed').textContent=(140/speed).toFixed(1)+'x';beep(900,.3);makeObstacles();document.getElementById('levelMsg').textContent='Level '+level+'! Speed Up!';document.getElementById('levelPanel').style.display='block';running=false;}
spawnFood();}else snake.pop();}
function draw(){cx.fillStyle='#0b1220';cx.fillRect(0,0,cv.width,cv.height);
// grid
cx.strokeStyle='rgba(255,255,255,0.03)';for(let i=0;i<=N;i++){cx.beginPath();cx.moveTo(i*S,0);cx.lineTo(i*S,cv.height);cx.stroke();cx.beginPath();cx.moveTo(0,i*S);cx.lineTo(cv.width,i*S);cx.stroke();}
// obstacles
cx.fillStyle='#475569';obstacles.forEach(o=>{cx.beginPath();cx.roundRect(o.x*S+2,o.y*S+2,S-4,S-4,4);cx.fill();});
// food apple
cx.fillStyle='#ef4444';cx.beginPath();cx.arc(food.x*S+S/2,food.y*S+S/2,S/2-2,0,7);cx.fill();
cx.strokeStyle='#22c55e';cx.lineWidth=2;cx.beginPath();cx.moveTo(food.x*S+S/2,food.y*S+2);cx.lineTo(food.x*S+S/2+3,food.y*S-3);cx.stroke();
// snake
snake.forEach((s,i)=>{const t=i/snake.length;cx.fillStyle=i===0?'#16a34a':`rgb(${34+t*20},${200-t*60},${80+t*40})`;cx.beginPath();cx.roundRect(s.x*S+1,s.y*S+1,S-2,S-2,i===0?8:5);cx.fill();
if(i===0){cx.fillStyle='white';const ex=dir.x===1?4:(dir.x===-1?12:(dir.y===1?4:12)),ey=dir.y===1?4:(dir.y===-1?12:4);cx.beginPath();cx.arc(s.x*S+ex+3,s.y*S+ey+3,2.5,0,7);cx.fill();cx.fillStyle='black';cx.beginPath();cx.arc(s.x*S+ex+3.5,s.y*S+ey+3.5,1.2,0,7);cx.fill();}});
// tongue
if(!gameOver){cx.strokeStyle='#ef4444';cx.lineWidth=2;cx.beginPath();const h=snake[0];cx.moveTo(h.x*S+S/2+dir.x*S/2,h.y*S+S/2+dir.y*S/2);cx.lineTo(h.x*S+S/2+dir.x*(S/2+5),h.y*S+S/2+dir.y*(S/2+5));cx.stroke();}
if(paused){cx.fillStyle='rgba(0,0,0,.5)';cx.fillRect(0,0,cv.width,cv.height);cx.fillStyle='white';cx.font='30px sans-serif';cx.textAlign='center';cx.fillText('PAUSED',cv.width/2,cv.height/2);}}
document.addEventListener('keydown',e=>{
if(e.key==='ArrowUp')setDir(0,-1);if(e.key==='ArrowDown')setDir(0,1);if(e.key==='ArrowLeft')setDir(-1,0);if(e.key==='ArrowRight')setDir(1,0);
if(e.key===' '||e.key.toLowerCase()==='p'){paused=!paused;if(!paused)loop();draw();}});
let tx,ty;cv.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;});
cv.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(Math.abs(dx)>Math.abs(dy)){if(dx>0)setDir(1,0);else setDir(-1,0);}else{if(dy>0)setDir(0,1);else setDir(0,-1);}});
draw();cx.fillStyle='#4ade80';cx.font='20px sans-serif';cx.textAlign='center';cx.fillText('Press Start',cv.width/2,cv.height/2);
</script>
</body>
</html>
